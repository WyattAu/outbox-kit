[package]
name = "outbox-kit"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Transactional outbox for Rust — durable event envelopes, at-least-once dispatch with breaker-aware backoff, Postgres/SQLite/memory stores, dead letters, Prometheus metrics"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/outbox-kit"
keywords = ["outbox", "events", "cqrs", "reliability", "webhooks"]
categories = ["asynchronous", "concurrency"]
exclude = [".github/", "benches/"]

[features]
default = ["serde", "memory", "dispatch", "metrics"]
serde = ["dep:serde"]
memory = []
dispatch = ["dep:breaker", "dep:futures", "dep:tokio"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:sqlx"]
metrics = ["dep:metrics-kit"]

[dependencies]
async-trait = "0.1"
# `timeout` is enabled deliberately: it appends a `Timeout` variant to
# `CircuitBreakerError`, and this crate's dispatch match must stay total
# under ANY feature unification a consumer enables (regression: 0.1.0
# failed to compile when a host turned `timeout` on).
breaker = { version = "2", features = ["timeout"], optional = true }
futures = { version = "0.3", default-features = false, features = [
  "std",
], optional = true }
metrics-kit = { version = "0.2", optional = true }
rand = { version = "0.10", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1", default-features = false, features = [
  "derive",
  "std",
], optional = true }
# Runtime queries only (no `macros`): the stores build statements at
# runtime, so the proc-macro stack stays out of consumer builds.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
], optional = true }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt",
  "sync",
  "time",
], optional = true }
uuid = { version = "1", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
criterion = "0.8"
futures = { version = "0.3", default-features = false, features = ["std"] }
proptest = "1"
serde_json = "1"
tempfile = "3"
# The postgres integration suite drives raw locking transactions next to
# the store (tests/postgres_outbox.rs, all #[ignore]d behind Docker).
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }

[[bench]]
name = "outbox_bench"
harness = false

[[test]]
name = "sqlite_outbox"
required-features = ["sqlite"]

[[test]]
name = "postgres_outbox"
required-features = ["postgres"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.layers]
tier = "L2"
